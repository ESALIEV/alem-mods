# Каталог мастерской обновляется сам: загрузили архив в mods/ (или удалили) — через минуту
# catalog.json и картинки в previews/ уже пересобраны. Руками ничего писать не нужно.
name: catalog
on:
  push:
    paths: ['mods/**', 'packs/**', 'add_mod.py', 'build_catalog.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_catalog.py
      - name: commit
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json previews
          git diff --cached --quiet || (git commit -m "Каталог обновлён автоматически" && git pull -q --rebase origin main && git push)
