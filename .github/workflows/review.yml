# Проверка заявок моддеров (Pull Request). Код из заявки НЕ запускается: берём скрипты из main,
# а архивы заявки читаем как данные (review_pr.py). Решение:
#   auto   → заявка принимается сама, каталог пересобирается;
#   manual → метка needs-review, ждёт автора игры;
#   reject → комментарий с ошибками, моддер исправляет и загружает снова.
name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || echo "antivirus base not updated"
          pip install -q nudenet pillow
      - name: review
        run: |
          git fetch -q origin "pull/$PR/head:pr"
          python review_pr.py --pr-ref pr --author "$AUTHOR"
          echo "DECISION=$(cat decision.txt)" >> "$GITHUB_ENV"
      - name: comment
        run: |
          gh label create needs-review --color FBCA04 --description "ждёт автора игры" 2>/dev/null || true
          gh label create rejected --color D73A4A --description "есть ошибки" 2>/dev/null || true
          gh pr comment "$PR" --body-file review.md
          gh pr edit "$PR" --remove-label needs-review --remove-label rejected || true
          if [ "$DECISION" = "manual" ]; then gh pr edit "$PR" --add-label needs-review; fi
          if [ "$DECISION" = "reject" ]; then gh pr edit "$PR" --add-label rejected; fi
      - name: auto-merge
        if: env.DECISION == 'auto'
        run: |
          gh pr merge "$PR" --squash --delete-branch=false
          # слияние ботом не запускает другие workflow — каталог пересобираем здесь же
          git checkout -q main && git pull -q origin main
          python build_catalog.py
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json previews
          git diff --cached --quiet || (git commit -q -m "Каталог: обновление из заявки #$PR" && git pull -q --rebase origin main && git push -q)

  # Автор игры принял НОВЫЙ мод — запоминаем, чей он: дальше его обновления от этого автора пойдут сами
  register:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          FILES=$(gh pr view "$PR" --json files -q '.files[].path')
          python review_pr.py --register --author "$AUTHOR" $FILES
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owners.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Владельцы модов: заявка #$PR" && git pull -q --rebase origin main && git push -q)
